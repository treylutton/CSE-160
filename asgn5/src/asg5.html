<!DOCTYPE html>
<html lang="en">
  <head>
  <script type="importmap">
  {
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.184.0/examples/jsm/",
    "simplex-noise": "https://cdn.jsdelivr.net/npm/simplex-noise@4.0.3/dist/esm/simplex-noise.js"
    }
  }
  </script>
    <style>
      body {
        background-color: #4c7282;
        color: #ffffff;
        font-family: Verdana, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 24px 16px 48px;
        gap: 20px;
      }

      header { text-align: center; }
      header h1 { font-size: 1.6rem; color: #FFFFFF; }
      header p  { font-size: 0.85rem; color: #000000; margin-top: 4px; }

      #c {
        display: block;
        border: 2px solid #ffffff;
      }

      #canvas-container {
        position: relative;
      }

      #p_performance {
        position: absolute;
        bottom: 8px;
        left: 8px;
        margin: 0;
        color: #aaa;
        font-family: monospace;
        font-size: 0.8rem;
      }

      #canvas-container .lil-gui {
        position: absolute;
        top: 0;
        right: 0;
        left: auto;
        bottom: auto;
      }

  /* --- collapsible settings tab --- */
      details.settings {
        width: 100%;
        max-width: 640px;
        background: rgba(0,0,0,0.25);
        border-radius: 6px;
        overflow: hidden;
      }

      details.settings summary {
        list-style: none;
        cursor: pointer;
        padding: 10px 16px;
        font-size: 0.85rem;
        font-weight: bold;
        color: #ffffff;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        user-select: none;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      details.settings summary::before {
        content: '▶';
        font-size: 0.65rem;
        transition: transform 0.2s;
      }

      details.settings[open] summary::before { transform: rotate(90deg); }

      /* --- nested subtabs inside a settings tab --- */
      details.settings details.settings {
        width: auto;
        max-width: 100%;
        background: rgba(0,0,0,0.2);
        border-radius: 4px;
        margin: 8px 12px;
      }

      details.settings details.settings summary {
        font-size: 0.78rem;
        padding: 8px 14px;
        color: #cccccc;
      }

      /* --- slider grid inside the tab --- */
      .slider-group {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px 24px;
        padding: 14px 20px 20px;
      }

      .slider-item {
        display: flex;
        flex-direction: column;
        gap: 6px;
        font-size: 0.8rem;
        color: #ccc;
      }

      .slider-item label {
        display: flex;
        justify-content: space-between;
      }

      .slider-item label span {
        color: #ffffff;
        font-weight: bold;
      }

      section {
        width: 100%;
        max-width: 640px;
      }

      section h2 {
        font-size: 0.95rem;
        color: #333333;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        margin-bottom: 10px;
        border-bottom: 1px solid #333;
        padding-bottom: 4px;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.85rem;
      }

      th, td {
        text-align: left;
        padding: 6px 10px;
        border-bottom: 1px solid #2d2d2d;
      }

      th { color: #d6cdcd; font-weight: normal; width: 40%; }
      td { color: #ddd; }

      #btn_regen {
        display: block;
        margin: 0 auto;
        padding: 10px 28px;
        background: #474747;
        color: #ffffff;
        border: none;
        border-radius: 4px;
        font-size: 0.9rem;
        font-weight: bold;
        cursor: pointer;
        letter-spacing: 0.04em;
      }

      #btn_regen:hover  { background: #027551; }
      #btn_regen.generating { background: #7a1a1a; cursor: not-allowed; }

      kbd {
        display: inline-block;
        background: #333;
        border: 1px solid #555;
        border-radius: 3px;
        padding: 1px 6px;
        font-size: 0.8rem;
        font-family: monospace;
      }
      
    </style>
     <meta charset="utf-8">
    <title>CSE-160 Assignment 5 - Lutton</title>
  </head>
  <body>
    <header>
      <h1>Island Generator </h1>
      <p>Trey Lutton &nbsp;|&nbsp; tlutton@ucsc.edu &nbsp;|&nbsp; CSE160 &mdash; Spring 2026</p>
    </header>

    <div id="canvas-container">
      <canvas id="c" width="900" height="600">
        Please use a browser that supports "canvas"
      </canvas>
      <p id="p_performance"></p>
    </div>

    <button id="btn_regen" class="generating" disabled>Generating...</button>

    <details class="settings">
      <summary>Island Generation Settings</summary>

      <details class="settings">
        <summary>Island Dimensions</summary>
        <div class="slider-group">
          <div class="slider-item">
            <label>Island Size <span id="v_world_size">150</span></label>
            <input type="range" min="20" max="200" step="10" value="150" id="s_world_size"
                   oninput="document.getElementById('v_world_size').textContent = this.value">
          </div>
          <div class="slider-item">
            <label>Island Divisions <span id="v_world_divs">100</span></label>
            <input type="range" min="10" max="200" step="10" value="100" id="s_world_divs"
                   oninput="document.getElementById('v_world_divs').textContent = this.value">
          </div>
        </div>
      </details>

      <details class="settings">
        <summary>Noise Layers</summary>
        <div class="slider-group">
          <div class="slider-item">
            <label>Layers <span id="v_layers">8</span></label>
            <input type="range" min="1" max="8" value="8" id="s_layers"
                   oninput="document.getElementById('v_layers').textContent = this.value">
          </div>
          <div class="slider-item">
            <label>First Layer Frequency <span id="v_layer0_freq">0.010</span></label>
            <input type="range" min="1" max="50" value="10" id="s_layer0_freq"
                   oninput="document.getElementById('v_layer0_freq').textContent = (this.value/1000).toFixed(3)">
          </div>
          <div class="slider-item">
            <label>First Layer Amplitude <span id="v_layer0_amp">7</span></label>
            <input type="range" min="1" max="20" step="1" value="7" id="s_layer0_amp"
                   oninput="document.getElementById('v_layer0_amp').textContent = this.value">
          </div>
        </div>
      </details>

      <details class="settings">
        <summary>Layer Modifiers</summary>
        <div class="slider-group">
          <div class="slider-item">
            <label>Persistence <span id="v_persistence">0.40</span></label>
            <input type="range" min="1" max="100" value="40" id="s_persistence"
                   oninput="document.getElementById('v_persistence').textContent = (this.value/100).toFixed(2)">
          </div>
          <div class="slider-item">
            <label>Lacunarity <span id="v_lacunarity">2.0</span></label>
            <input type="range" min="10" max="40" value="20" id="s_lacunarity"
                   oninput="document.getElementById('v_lacunarity').textContent = (this.value/10).toFixed(1)">
          </div>
        </div>
      </details>

      <details class="settings">
        <summary>Vegetation</summary>
        <div class="slider-group">
          <div class="slider-item">
            <label>Pine Count <span id="v_pine_count">40</span></label>
            <input type="range" min="0" max="200" step="5" value="40" id="s_pine_count"
                   oninput="document.getElementById('v_pine_count').textContent = this.value">
          </div>
          <div class="slider-item">
            <label>Fern Count <span id="v_fern_count">40</span></label>
            <input type="range" min="0" max="100" step="5" value="40" id="s_fern_count"
                   oninput="document.getElementById('v_fern_count').textContent = this.value">
          </div>
          <div class="slider-item">
            <label>Grass Count <span id="v_grass_count">500</span></label>
            <input type="range" min="0" max="2000" step="50" value="500" id="s_grass_count"
                   oninput="document.getElementById('v_grass_count').textContent = this.value">
          </div>
        </div>
      </details>

    </details>

    <details class="settings">
      <summary>Sun Settings</summary>
      <div class="slider-group">
        <div class="slider-item">
          <label>Sun Direction <span id="v_sun_azimuth">180</span>°</label>
          <input type="range" min="0" max="360" value="180" id="s_sun_azimuth"
                 oninput="document.getElementById('v_sun_azimuth').textContent = this.value">
        </div>
      </div>
    </details>

    <details class="settings">
      <summary>Vegetation Sway Settings</summary>
      <div class="slider-group">

        <div class="slider-item">
          <label>Sine Wave Frequency<span id="v_wind_freq">20</span></label>
          <input type="range" min="0" max="50" value="20" id="s_wind_freq"
                 oninput="document.getElementById('v_wind_freq').textContent = this.value">
        </div>

        <div class="slider-item">
          <label>Sine Wave Amplitude<span id="v_wind_amp">2</span></label>
          <input type="range" min="0" max="20" value="2" id="s_wind_amp"
                 oninput="document.getElementById('v_wind_amp').textContent = this.value">
        </div>

        <div class="slider-item">
          <label>X-Direction Strength<span id="v_wind_x">10</span></label>
          <input type="range" min="-10" max="10" value="10" id="s_wind_x"
                 oninput="document.getElementById('v_wind_x').textContent = this.value">
        </div>

        <div class="slider-item">
          <label>Z-Direction Strength<span id="v_wind_z">10</span></label>
          <input type="range" min="-10" max="10" value="10" id="s_wind_z"
                 oninput="document.getElementById('v_wind_z').textContent = this.value">
        </div>

        <div class="slider-item">
          <label>Ripple Effect<span id="v_wind_rip">5</span></label>
          <input type="range" min="0" max="10" value="5" id="s_wind_rip"
                 oninput="document.getElementById('v_wind_rip').textContent = this.value">
        </div>
      </div>
    </details>

    <div>

          Extra features and notes are documented in the <a href="https://github.com/treylutton/CSE-160/blob/main/asgn5/README.md" style="color:#00a2ff;">README</a></p>

    </div>


    <script type="module" src="./asg5.js"></script>
  </body>
</html>

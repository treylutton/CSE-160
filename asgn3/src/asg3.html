<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Lutton Assignment 2</title>
  </head>

  <body onload="main()" style="background-color: #2a2a2a; color: white; font-family: Verdana, sans-serif;">
    <div>
      <h1>Assignment 3 - Blocky World</h1>
      <p>Trey Lutton | tlutton@ucsc.edu | CSE160 - Spring 2026</p>
    </div>
    <canvas id="webgl" width="600" height="600">
    Please use a browser that supports "canvas"
    </canvas>

    <div>
      <button type="button" id="b_anim_tog" style="background-color: #888;">Animation: OFF</button>
    </div>

    <p style="font-weight: bold; font-size: 16px;"> 
      <label>asg3 sliders</label>
    </p>
  
    <div style="display: inline-flex; flex-direction: column; align-items: center;">
      <label>Player Speed</label>
      <input type="range" min="0" max="10" value="2" class="slider" id="s_player_speed">
    </div>
    <div style="display: inline-flex; flex-direction: column; align-items: center;">
      <label>Mouse Sensitivity</label>
      <input type="range" min="10" max="100" value="40" class="slider" id="s_mouse_sens">
    </div>
    <div style="display: inline-flex; flex-direction: column; align-items: center;">
      <label>FOV</label>
      <input type="range" min="60" max="110" value="60" class="slider" id="s_fov">
    </div>
    <div style="display: inline-flex; flex-direction: column; align-items: center;">
      <label>Ox Speed</label>
      <input type="range" min="5" max="25" value="10" class="slider" id="s_ox_speed">
    </div>

    <p style="font-weight: bold; font-size: 16px;"> 
      <label>Performance Stats</label>
    </p>

    <p id="p_performance"> No Performance Stats to Display. </p>

    <p style="font-weight: bold; font-size: 16px;"> 
      <label>Notes for grader</label>
    </p>

    <p>
      todo!
    </p>

    <script src="../lib/webgl-utils.js"></script>
    <script src="../lib/webgl-debug.js"></script>
    <script src="../lib/cuon-utils.js"></script>
    <script src="../lib/cuon-matrix-cse160.js"></script>
    <script src="Triangle.js"></script>
    <script src="Cube.js"></script>
    <script src="Pyramid.js"></script>
    <script src="Camera.js"></script>
    <script src="asg3.js"></script>
  </body>
</html>
